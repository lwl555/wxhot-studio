name: 每日热榜采集

# 自动抓取最新热榜并更新 articles.json
# 每小时跑两次（cron 为 UTC，北京=UTC+8）：整点 + 23 分错峰。
# GitHub 的定时任务经常延迟甚至跳过整点那次，第二批次保证数据最多落后约 1 小时
on:
  push:
    branches: [main]     # 推送即跑一次：定时任务常被延迟/跳过，这样改完能立刻验证
  schedule:
    - cron: '0 * * * *'
    - cron: '23 * * * *'
  workflow_dispatch:      # 支持在 GitHub 页面手动点「Run workflow」立即跑一次

permissions:
  contents: write         # 允许提交更新数据文件

# 同一时刻只允许一个采集实例：定时/推送/手动同时触发时会互相抢 articles.json，
# 后提交的 git push 会被拒（non-fast-forward），导致整个 run 报失败邮件。
concurrency:
  group: fetch-hotlist
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取最新热榜
        run: python fetch_hot.py

      - name: 补充开源热榜（DailyHotApi）
        continue-on-error: true      # 公开实例可能不稳，失败不影响主数据
        run: python fetch_dailyhot.py

      - name: 采集真实封面
        continue-on-error: true      # 封面采集失败不影响主数据
        run: python fetch_covers.py

      - name: 检查数据是否变化
        id: check
        run: |
          git diff --quiet data/articles.json && echo "changed=no" >> $GITHUB_OUTPUT || echo "changed=yes" >> $GITHUB_OUTPUT

      - name: 提交更新
        if: steps.check.outputs.changed == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: 自动更新热榜数据 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          # 双保险：若仍碰到远端领先（如手动触发撞上定时），先变基再推；冲突则放弃变基（下轮定时会补上）
          git pull --rebase origin main || git rebase --abort
          git push

      - name: 汇总结果
        run: |
          echo "采集完成：$(python -c "import json;d=json.load(open('data/articles.json',encoding='utf-8'));a=d['articles'] if isinstance(d,dict) else d;print(len(a),'篇, 真实阅读量',sum(1 for x in a if x.get('hasRealRead')),'篇')")"
